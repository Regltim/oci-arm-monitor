server:
  port: 9090
  forward-headers-strategy: framework
  servlet:
    context-path: /api
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${MONITOR_COOKIE_SECURE:false}

spring:
  application:
    name: oci-arm-cost-monitor
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:${OCI_MONITOR_DB:./oci-arm-cost-monitor.db}
  sql:
    init:
      mode: always

monitor:
  admin:
    username: ${MONITOR_ADMIN_USERNAME:}
    password: ${MONITOR_ADMIN_PASSWORD:}
  oci:
    auth-mode: ${OCI_AUTH_MODE:config_file}
    config-file-path: ${OCI_CONFIG_FILE_PATH:~/.oci/config}
    profile: ${OCI_CONFIG_PROFILE:DEFAULT}
    region: ${OCI_REGION:}
    compartment-ocid: ${OCI_COMPARTMENT_OCID:}
    tenancy-ocid: ${OCI_TENANCY_OCID:}
  server:
    metrics-enabled: ${MONITOR_SERVER_METRICS_ENABLED:true}
    metrics-sample-delay-millis: ${MONITOR_SERVER_METRICS_SAMPLE_DELAY_MILLIS:15000}
    history-retention-hours: ${MONITOR_SERVER_HISTORY_RETENTION_HOURS:72}
    proc-path: ${MONITOR_SERVER_PROC_PATH:/host/proc}
    disk-path: ${MONITOR_SERVER_DISK_PATH:/data}
  wechat:
    enabled: ${MONITOR_WECHAT_ENABLED:false}
    app-id: ${MONITOR_WECHAT_APP_ID:}
    app-secret: ${MONITOR_WECHAT_APP_SECRET:}
    template-id: ${MONITOR_WECHAT_TEMPLATE_ID:}
    cost-template-id: ${MONITOR_WECHAT_COST_TEMPLATE_ID:}
    open-ids: ${MONITOR_WECHAT_OPEN_IDS:}
    immediate-push-enabled: ${MONITOR_WECHAT_IMMEDIATE_PUSH_ENABLED:true}
    daily-summary-enabled: ${MONITOR_WECHAT_DAILY_SUMMARY_ENABLED:false}
    daily-summary-time: ${MONITOR_WECHAT_DAILY_SUMMARY_TIME:09:00}
    zone-id: ${MONITOR_WECHAT_ZONE_ID:Asia/Shanghai}
    public-url: ${MONITOR_PUBLIC_URL:}
    api-base-url: ${MONITOR_WECHAT_API_BASE_URL:https://api.weixin.qq.com}
    settings-encryption-key: ${MONITOR_SETTINGS_ENCRYPTION_KEY:}
  cors:
    allowed-origins: ${MONITOR_CORS_ALLOWED_ORIGINS:http://localhost:8000,http://127.0.0.1:8000,http://localhost:8001,http://127.0.0.1:8001}
