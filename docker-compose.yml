services:
  oci-arm-monitor-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: oci-arm-cost-monitor-server:latest
    container_name: oci-arm-cost-monitor-server
    restart: unless-stopped
    expose:
      - "9090"
    environment:
      MONITOR_ADMIN_USERNAME: ${MONITOR_ADMIN_USERNAME:?MONITOR_ADMIN_USERNAME is required}
      MONITOR_ADMIN_PASSWORD: ${MONITOR_ADMIN_PASSWORD:?MONITOR_ADMIN_PASSWORD is required}
      MONITOR_COOKIE_SECURE: ${MONITOR_COOKIE_SECURE:-false}
      MONITOR_CORS_ALLOWED_ORIGINS: ${MONITOR_CORS_ALLOWED_ORIGINS:-http://localhost:28461,http://127.0.0.1:28461}
      MONITOR_PUBLIC_URL: ${MONITOR_PUBLIC_URL:-}
      MONITOR_WECHAT_ENABLED: ${MONITOR_WECHAT_ENABLED:-false}
      MONITOR_WECHAT_APP_ID: ${MONITOR_WECHAT_APP_ID:-}
      MONITOR_WECHAT_APP_SECRET: ${MONITOR_WECHAT_APP_SECRET:-}
      MONITOR_WECHAT_TEMPLATE_ID: ${MONITOR_WECHAT_TEMPLATE_ID:-}
      MONITOR_WECHAT_OPEN_IDS: ${MONITOR_WECHAT_OPEN_IDS:-}
      MONITOR_WECHAT_IMMEDIATE_PUSH_ENABLED: ${MONITOR_WECHAT_IMMEDIATE_PUSH_ENABLED:-true}
      MONITOR_WECHAT_DAILY_SUMMARY_ENABLED: ${MONITOR_WECHAT_DAILY_SUMMARY_ENABLED:-false}
      MONITOR_WECHAT_DAILY_SUMMARY_TIME: ${MONITOR_WECHAT_DAILY_SUMMARY_TIME:-09:00}
      MONITOR_WECHAT_ZONE_ID: ${MONITOR_WECHAT_ZONE_ID:-Asia/Shanghai}
      MONITOR_SETTINGS_ENCRYPTION_KEY: ${MONITOR_SETTINGS_ENCRYPTION_KEY:-}
      OCI_MONITOR_DB: /data/oci-arm-cost-monitor.db
      OCI_AUTH_MODE: ${OCI_AUTH_MODE:-instance_principal}
      OCI_CONFIG_FILE_PATH: /home/monitor/.oci/config
      OCI_CONFIG_PROFILE: ${OCI_CONFIG_PROFILE:-DEFAULT}
      OCI_REGION: ${OCI_REGION:?OCI_REGION is required}
      OCI_COMPARTMENT_OCID: ${OCI_COMPARTMENT_OCID:?OCI_COMPARTMENT_OCID is required}
      OCI_TENANCY_OCID: ${OCI_TENANCY_OCID:-}
      MONITOR_OCI_CONNECT_TIMEOUT_MILLIS: ${MONITOR_OCI_CONNECT_TIMEOUT_MILLIS:-10000}
      MONITOR_OCI_READ_TIMEOUT_MILLIS: ${MONITOR_OCI_READ_TIMEOUT_MILLIS:-60000}
      MONITOR_LOG_LEVEL: ${MONITOR_LOG_LEVEL:-INFO}
      MONITOR_OCI_SDK_LOG_LEVEL: ${MONITOR_OCI_SDK_LOG_LEVEL:-WARN}
      MONITOR_SERVER_METRICS_ENABLED: ${MONITOR_SERVER_METRICS_ENABLED:-true}
      MONITOR_SERVER_METRICS_SAMPLE_DELAY_MILLIS: ${MONITOR_SERVER_METRICS_SAMPLE_DELAY_MILLIS:-15000}
      MONITOR_SERVER_HISTORY_RETENTION_HOURS: ${MONITOR_SERVER_HISTORY_RETENTION_HOURS:-72}
      MONITOR_SERVER_PROC_PATH: /host/proc
      MONITOR_SERVER_DISK_PATH: /data
    volumes:
      - oci-arm-monitor-data:/data
      - ${OCI_CONFIG_DIR:-./deploy/oci}:/home/monitor/.oci:ro
      - /proc:/host/proc:ro
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/9090' || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  oci-arm-monitor-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: oci-arm-monitor-web:latest
    container_name: oci-arm-monitor-web
    restart: unless-stopped
    ports:
      - "${MONITOR_WEB_BIND_ADDRESS:-127.0.0.1}:${MONITOR_WEB_PORT:-28461}:8080"
    depends_on:
      oci-arm-monitor-server:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  oci-arm-monitor-data:
